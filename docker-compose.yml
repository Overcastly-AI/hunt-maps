# Ridgeline — deploy this. One command, nothing else required.
#
#   git clone https://github.com/Overcastly-AI/hunt-maps.git
#   cd hunt-maps
#   docker compose up -d --build
#
# Self-contained on purpose: no .env, no --env-file, no interpolation. A host
# that clones this repo and runs `docker compose up -d --build` gets a working
# stack, which is the only thing most deploy tooling knows how to do.
#
# Images are BUILT here rather than pulled. The GHCR images are not reliably
# published — see .github/workflows/publish-images.yml — and an image that
# does not exist fails at pull with an error that reads like a bad tag.
# Building needs only this repository, which is public.
#
# For local development with hot reload use `pnpm dev`, or the previous
# environment-driven compose file, now docker-compose.dev.yml.
#
# ---------------------------------------------------------------------------
# THE CREDENTIALS BELOW ARE PUBLIC, because this repository is. That is fine
# for a disposable demo and unacceptable for anything else. Postgres is not
# published to the host, so the database password is only reachable from
# inside the compose network — but the JWT secret would let anyone mint valid
# tokens against an instance running this file. Generate your own before this
# holds data you care about, and keep them out of git.
# ---------------------------------------------------------------------------

name: ridgeline

services:
  db:
    # PostGIS, not plain Postgres. Every meaningful query here is spatial; a
    # stock postgres image comes up healthy and then fails on the first
    # geometry column.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ridgeline
      POSTGRES_PASSWORD: "sVK9hY5Sk9chx1PVQhIKOSLcOlHJH6W6"
      POSTGRES_DB: ridgeline
      # Initialise into a subdirectory of the mount. On ext4 the mount root
      # holds lost+found, which makes the directory look non-empty and aborts
      # initdb with an error that never mentions lost+found.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ridgeline -d ridgeline']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    # No `ports:` on purpose. Publishing 5432 would put Postgres on the public
    # internet, which is the most common way a small deployment is compromised.
    # Use `docker compose exec db psql -U ridgeline ridgeline`.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # The password is alphanumeric by construction. A base64 password would
      # contain / and +, which are structural in a URI, and the resulting
      # connection failure looks exactly like wrong credentials.
      DATABASE_URL: "postgresql://ridgeline:sVK9hY5Sk9chx1PVQhIKOSLcOlHJH6W6@db:5432/ridgeline"
      JWT_SECRET: "XiGxxnReAJFs7pGrIyJ0rsYPAo/mJ/u+t9591WTLyutPlx7F2RR7dnpd5lF7LUX9"
      # Must match the address you load the app from — scheme, host and port —
      # or the browser blocks every API call. Localhost entries cover an SSH
      # tunnel; add your server's own URL when reaching it directly.
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://167.88.46.225:8080"
      DEM_3DEP_TEMPLATE: ""
      NODE_ENV: production
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /api/health reports PostGIS reachability, so this is green only when
      # spatial queries can actually run. A TCP check would call a container
      # healthy that cannot serve a map.
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3001/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped
    # Unpublished as well. The browser reaches the API through the web
    # container's nginx at /api, same-origin, so CORS never has to be widened.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Compiled into the JS bundle by Vite at build time — there is no
        # runtime override. Empty falls back to public AWS Terrarium tiles,
        # which the browser fetches directly.
        VITE_DEM_TEMPLATE: ""
    depends_on:
      api:
        condition: service_started
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/index.html >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  db-data:
