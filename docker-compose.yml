# Ridgeline — local development stack.
#
#   cp .env.example .env      # JWT_SECRET is required
#   docker compose up -d --build
#
# This is the *development* file: it builds from source, publishes the API on
# its own port so you can hit Swagger and curl endpoints directly, and takes
# its configuration from the environment.
#
# For deploying to a server see `deploy/compose/`, and for Kubernetes see
# `deploy/helm/`. Those deliberately publish less and assume nothing about
# your shell.
#
# `security_opt: no-new-privileges` on every service blocks setuid binaries
# inside a container from gaining privileges the container was not started
# with. It costs nothing and closes the most common escalation path from a
# remote-code-execution bug in an application dependency.

name: ridgeline-dev

services:
  db:
    # PostGIS, not plain Postgres. Every meaningful query in this app is
    # spatial; the extension is a hard requirement, not an add-on. A stock
    # postgres image comes up healthy and then fails on the first geometry
    # column.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ridgeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ridgeline}
      POSTGRES_DB: ${POSTGRES_DB:-ridgeline}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Published in development only, so you can point psql, TablePlus or a
      # migration tool at it. The deployment files do not do this — see
      # deploy/compose/README.md.
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ridgeline}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ridgeline}:${POSTGRES_PASSWORD:-ridgeline}@db:5432/${POSTGRES_DB:-ridgeline}
      # No default. The app refuses to boot without a real secret rather than
      # shipping a weak one that could reach production.
      #
      # Quoted, and the hint deliberately carries no ": " — a colon-space in an
      # unquoted YAML scalar ends the scalar, and an earlier version of this
      # hint ("generate with: openssl rand -base64 48") made the whole file
      # unparseable. It failed with a YAML error pointing at a column, which
      # reads as a stray character rather than as the help text eating itself.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET first — run 'openssl rand -base64 48'}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEM_3DEP_TEMPLATE: ${DEM_3DEP_TEMPLATE:-}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Development convenience: Swagger at http://localhost:3001/api/docs.
      - '${API_PORT:-3001}:3001'
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vite inlines this at build time, so it is a build arg and not an
        # environment variable — there is no runtime override. Empty falls back
        # to the public AWS Terrarium tiles.
        VITE_DEM_TEMPLATE: ${VITE_DEM_TEMPLATE:-}
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:8080'
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']

volumes:
  db-data:

# Redis was removed rather than left running. It was started here and passed to
# the API as REDIS_URL, but nothing consumes it: there is no redis, ioredis or
# bull dependency in apps/api/package.json and no import anywhere in
# apps/api/src. Bring it back in the same change that adds a consumer.
