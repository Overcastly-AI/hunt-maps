name: Release

# Semantic release, then images tagged with the version it decided.
#
# The two live in ONE workflow on purpose, in dependent jobs. The obvious
# alternative — let semantic-release push a `v*` tag and have a separate
# tag-triggered workflow build the images — silently does nothing here:
# GitHub does not raise `push` events for commits or tags created with
# GITHUB_TOKEN, which is its guard against a workflow triggering itself. We
# hit exactly that when a PR merged through the API produced no run at all.
# A tag-triggered publish would look correctly configured and never fire.
#
# So: the release job decides the version, and the images job consumes it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  # Never cancel a release mid-flight. A cancelled run can leave a tag and a
  # GitHub Release created with no images published against them, which is
  # worse than a queued run.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags, releases, and the changelog commit
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the full history to work out what changed
          # since the last tag. A shallow clone makes every run look like the
          # first one.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No `cache: pnpm` here. This job never runs `pnpm install` —
          # semantic-release and its plugins are installed by the action — so
          # there is no pnpm store to save, and the cache POST step fails the
          # whole job with "Path(s) specified in the action for caching do(es)
          # not exist". That failure happens *after* the release is published,
          # so the tag, GitHub release and changelog all land and then the job
          # goes red, which skipped the images and chart entirely.

      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          # Pinned rather than floating: a release pipeline that changes
          # behaviour on its own is the last thing you want to debug.
          semantic_version: 24.2.0
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/exec@6.0.3
            @semantic-release/git@10.0.1
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: release
    # `always()` deliberately. Without it these jobs are skipped whenever the
    # release job goes red for any reason — including a post-step failure that
    # happens after the release is already published, which is exactly how
    # v1.1.0 ended up tagged with no images built. The `published` output is
    # only ever 'true' when semantic-release actually released something, so
    # this cannot fire on a genuine release failure.
    if: always() && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing exchanges this OIDC token for a short-lived
      # certificate, so there is no private key to store or rotate. Without it
      # the signing step fails with an auth error that looks like a registry
      # problem.
      id-token: write

    strategy:
      # Don't let one image failing cancel the other — a release with the API
      # published and the web missing is recoverable; losing both is not.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          # The release job just pushed the changelog and version bump. Check
          # out the tag it created, not the branch head as it was when this
          # workflow started, or the image contents and the version label
          # disagree.
          ref: v${{ needs.release.outputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hunt-maps-${{ matrix.name }}
          # Exact version, then the moving major.minor and major aliases, then
          # latest. Deployments should pin the exact one; the aliases exist so
          # a patch bump can be picked up deliberately, not by surprise.
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          # Both architectures. arm64 costs build time under QEMU, but a
          # release artefact that only runs on one architecture is not a
          # release — Apple Silicon and Graviton are both ordinary targets,
          # and finding out at `docker run` is far more expensive than the
          # extra minutes here. Development images (publish-images.yml) stay
          # amd64-only, where the tradeoff genuinely does favour speed.
          platforms: linux/amd64,linux/arm64
          # Supply-chain metadata: a signed SLSA provenance attestation and an
          # SBOM, both attached to the image in the registry.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,scope=release-${{ matrix.name }},mode=max

      - name: Lowercase the owner
        # OCI repository names must be lowercase, and this account is
        # "Overcastly-AI". docker/metadata-action lowercases for us, which is
        # why the image builds work — but `helm push` and `cosign` take the
        # reference verbatim, and both fail on the capitals:
        #   invalid reference: invalid repository "Overcastly-AI/charts/ridgeline"
        # GitHub expressions have no lowercase function, so it happens here.
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign by digest, never by tag. A tag is mutable — signing
          # `:latest` produces a signature that stops matching the moment the
          # tag moves, which is worse than no signature because it looks like
          # tampering.
          cosign sign --yes \
            "ghcr.io/${OWNER_LC}/hunt-maps-${{ matrix.name }}@${DIGEST}"

      - name: Summarise
        run: |
          {
            echo "### \`${{ matrix.name }}\` v${{ needs.release.outputs.version }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    needs: release
    # See the note on `images` — same reasoning.
    if: always() && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the packaged chart to the release
      packages: write # push the chart to GHCR as an OCI artifact
    steps:
      - uses: actions/checkout@v4
        with:
          # Same tag the images are built from, so the chart's appVersion —
          # which is what its templates resolve image tags to — matches images
          # that actually exist.
          ref: v${{ needs.release.outputs.version }}

      - uses: azure/setup-helm@v4

      - name: Lint and package
        run: |
          helm lint ./deploy/helm/ridgeline
          # Render every conditional path before publishing. Most chart bugs
          # live in a branch the default values never exercise, and a chart
          # that only renders with defaults is a chart that breaks the first
          # time someone turns something on.
          helm template rl ./deploy/helm/ridgeline >/dev/null
          helm template rl ./deploy/helm/ridgeline \
            --set ingress.enabled=true --set networkPolicy.enabled=true \
            --set api.pdb.enabled=true --set web.pdb.enabled=true \
            --set api.autoscaling.enabled=true >/dev/null
          helm template rl ./deploy/helm/ridgeline \
            --set externalDatabase.url=postgresql://u:p@h:5432/d >/dev/null
          helm package ./deploy/helm/ridgeline --destination dist

      - name: Attach to the release
        # Before the registry push, deliberately. The GitHub release asset is
        # the fallback distribution channel, and a registry problem should not
        # also cost the .tgz — which is exactly what happened when the OCI push
        # failed on a capitalised owner and this step never ran.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.release.outputs.version }}" \
            dist/ridgeline-${{ needs.release.outputs.version }}.tgz --clobber

      - name: Lowercase the owner
        # OCI repository names must be lowercase, and this account is
        # "Overcastly-AI". docker/metadata-action lowercases for us, which is
        # why the image builds work — but `helm push` and `cosign` take the
        # reference verbatim, and both fail on the capitals:
        #   invalid reference: invalid repository "Overcastly-AI/charts/ridgeline"
        # GitHub expressions have no lowercase function, so it happens here.
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Push the chart to GHCR
        # Pushes to ghcr.io/<owner>/hunt-maps/ridgeline — helm appends the
        # chart name to this path. Namespaced under the repository rather than
        # a bare `charts/`, which is account-level and would collide the first
        # time a second repo here publishes a chart. It also keeps the chart
        # alongside hunt-maps-api and hunt-maps-web instead of orphaned in a
        # generic namespace.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push \
            "dist/ridgeline-${{ needs.release.outputs.version }}.tgz" \
            "oci://ghcr.io/${OWNER_LC}/hunt-maps"
