name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # A real PostGIS instance. Spatial behaviour cannot be mocked meaningfully,
      # and a schema that migrates against plain Postgres tells us nothing.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ridgeline
          POSTGRES_PASSWORD: ridgeline
          POSTGRES_DB: ridgeline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ridgeline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ridgeline:ridgeline@localhost:5432/ridgeline_test
      # Test-only value; production refuses to boot without a real secret.
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm --filter @hunt-maps/api exec prisma generate

      - name: Build (topological — terrain → shared → apps)
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Verify migrations apply to an empty database
        run: pnpm --filter @hunt-maps/api exec prisma migrate deploy

      - name: Assert the terrain engine has no runtime dependencies
        # It ships into a browser service worker. A single dependency creeping in
        # breaks the offline path, and it breaks it silently — the bundle just
        # gets bigger until something fails to resolve at runtime.
        run: |
          deps=$(node -p "JSON.stringify(require('./packages/terrain/package.json').dependencies || {})")
          if [ "$deps" != "{}" ]; then
            echo "packages/terrain must have zero runtime dependencies, found: $deps"
            exit 1
          fi
          echo "packages/terrain is dependency-free ✓"

      - name: Assert design tokens have not drifted from generated CSS
        # tokens.css is generated from tokens.ts. Both are consumed — CSS by the
        # stylesheets, TypeScript by MapLibre paint properties and canvas ramps —
        # so a stale stylesheet means the chrome and the map disagree about what
        # "accent" is, invisibly.
        run: |
          pnpm --filter @hunt-maps/design build:tokens
          if ! git diff --quiet -- packages/design/src/tokens.css; then
            echo "tokens.css is out of date. Run: pnpm --filter @hunt-maps/design build:tokens"
            git --no-pager diff -- packages/design/src/tokens.css
            exit 1
          fi
          echo "design tokens are in sync ✓"

      - name: Assert no literal colours leaked outside the design system
        # The design system is only a source of truth if nothing bypasses it.
        # A hex literal in an app stylesheet is how a design system quietly
        # stops being one — the value works, so nobody notices until a palette
        # change misses half the UI.
        run: |
          leaked=$(grep -rInE '#[0-9a-fA-F]{3,8}\b' \
            --include='*.css' --include='*.tsx' --include='*.ts' \
            apps/web/src \
            | grep -v 'packages/design' \
            | grep -vE '^\s*//|/\*|\*' \
            || true)
          if [ -n "$leaked" ]; then
            echo "Literal colours found outside packages/design:"
            echo "$leaked"
            echo ""
            echo "Add the value to packages/design/src/tokens.ts and reference the token."
            exit 1
          fi
          echo "no colour literals outside the design system ✓"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: JWT_SECRET=ci-placeholder docker compose config --quiet

      # A Dockerfile that installs before copying every workspace dependency's
      # package.json cannot build at all — pnpm fails resolving `workspace:*`.
      # `@hunt-maps/design` was missing from apps/web/Dockerfile from the day
      # the design system was extracted, so the web image silently stopped
      # building. This is cheaper to assert than to rediscover: it fails in
      # under a second, where the real symptom was an 8-second build failure
      # inside a job that only ran on push.
      - name: Assert Dockerfiles copy every workspace dependency they need
        run: |
          node -e '
            const fs = require("fs");
            let bad = false;
            for (const app of fs.readdirSync("apps")) {
              const pkgPath = `apps/${app}/package.json`;
              const dockerfile = `apps/${app}/Dockerfile`;
              if (!fs.existsSync(pkgPath) || !fs.existsSync(dockerfile)) continue;
              const deps = Object.keys(JSON.parse(fs.readFileSync(pkgPath, "utf8")).dependencies || {})
                .filter((d) => d.startsWith("@hunt-maps/"));
              const df = fs.readFileSync(dockerfile, "utf8");
              for (const dep of deps) {
                const name = dep.split("/")[1];
                if (!df.includes(`packages/${name}/package.json`)) {
                  console.error(`${dockerfile} never copies packages/${name}/package.json, but ${pkgPath} depends on ${dep} — pnpm install will fail resolving workspace:*`);
                  bad = true;
                }
              }
            }
            process.exit(bad ? 1 : 0);
          '
      # The images are built and actually run in the `smoke` job below, so
      # they are not built twice here.

  smoke:
    # Builds both images and actually RUNS them. `docker build` succeeding
    # proves only that the image assembles — it says nothing about whether the
    # process inside can start, which is exactly what changed when both images
    # moved to non-root users. Every other gate in this repo would stay green
    # while the containers crash-looped on a permissions error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -f apps/api/Dockerfile -t ridgeline-api:ci .
          docker build -f apps/web/Dockerfile -t ridgeline-web:ci .

      - name: Assert both images run as a NUMERIC non-root user
        # Numeric, not merely non-root. Kubernetes `runAsNonRoot: true` makes
        # the kubelet verify the user before starting the container, and it can
        # only do that from a numeric UID. `USER node` passes an `id -u` check
        # inside docker — the shell resolves the name fine — and then the pod
        # never starts:
        #   container has runAsNonRoot and image has non-numeric user (node),
        #   cannot verify user is non-root
        # The earlier version of this step asserted only `id -u != 0` and
        # therefore shipped exactly that bug.
        run: |
          for img in ridgeline-api:ci ridgeline-web:ci; do
            uid=$(docker run --rm --entrypoint sh "$img" -c 'id -u')
            cfg=$(docker image inspect -f '{{.Config.User}}' "$img")
            echo "$img -> runtime uid $uid, image USER '$cfg'"
            if [ "$uid" = "0" ]; then
              echo "::error::$img runs as root"; exit 1
            fi
            case "$cfg" in
              ''|*[!0-9:]*)
                echo "::error::$img declares USER '$cfg', which is not numeric — Kubernetes runAsNonRoot cannot verify it and the pod will fail with CreateContainerConfigError"
                exit 1 ;;
            esac
          done

      - name: Run the stack and hit the endpoints
        run: |
          docker network create ridgeline-ci
          docker run -d --name db --network ridgeline-ci \
            -e POSTGRES_USER=ridgeline -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_DB=ridgeline postgis/postgis:16-3.4
          # Wait for the database rather than sleeping a fixed amount; a fixed
          # sleep is how this kind of job becomes intermittently red.
          for i in $(seq 1 60); do
            docker exec db pg_isready -U ridgeline >/dev/null 2>&1 && break
            sleep 2
          done

          docker run -d --name api --network ridgeline-ci -p 3001:3001 \
            -e DATABASE_URL=postgresql://ridgeline:ci@db:5432/ridgeline \
            -e JWT_SECRET=ci-smoke-test-secret-at-least-32-characters-long \
            -e NODE_ENV=production -e PORT=3001 \
            ridgeline-api:ci
          docker run -d --name web --network ridgeline-ci -p 8080:8080 ridgeline-web:ci

          # The API migrates on boot, so allow for that before calling it dead.
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::API never became healthy"
            docker logs api
            exit 1
          fi

          # Assert the CONTENT of the health response, not just a 2xx.
          # /api/health answers 200 with {"status":"degraded","postgis":null}
          # when it cannot query PostGIS, so `curl -fsS` alone is green for an
          # API that can serve no spatial query at all — every map request 500s
          # and CI never notices. `ok` requires postgis_version() to answer.
          body=$(curl -fsS http://localhost:3001/api/health)
          echo "$body"
          case "$body" in
            *'"status":"ok"'*) ;;
            *)
              echo "::error::API health is not 'ok' — it is reachable but cannot query PostGIS: $body"
              docker logs api | tail -40
              exit 1 ;;
          esac

          curl -fsS http://localhost:8080/index.html >/dev/null \
            || { echo "::error::web did not serve index.html"; docker logs web; exit 1; }

          echo "api and web both healthy as non-root, with PostGIS reachable"

      - name: Container state and logs on failure
        if: failure()
        run: |
          # Status first. A container that exited tells you immediately that
          # this is a startup failure rather than a health-check timeout, and
          # the two have completely different causes.
          echo '--- container state ---'
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          for c in db api web; do
            code=$(docker inspect -f '{{.State.ExitCode}}' "$c" 2>/dev/null || echo '?')
            echo "--- $c (exit=$code) ---"
            docker logs "$c" 2>&1 | tail -60 || true
          done

  shipped-artifact:
    # Assert what the IMAGE SERVES, not what the source tree says. (R81)
    #
    # This job exists because of a P0 that made the product useless for months
    # and that every other gate in this repository was structurally incapable
    # of seeing:
    #
    #   apps/web/Dockerfile declared `ARG VITE_DEM_TEMPLATE=""`, so the variable
    #   was defined-and-EMPTY in every image. Vite inlines import.meta.env at
    #   build time, so the bundle got `""`, every DEM tile URL resolved to `""`,
    #   and every terrain layer — hillshade, slope, aspect, landform, bedding,
    #   corridors — rendered blank in every container ever deployed. Nothing
    #   threw. All 330 web tests passed, because locally and in CI the variable
    #   is simply UNSET and the fallback fires. The tests exercised a code path
    #   production never takes.
    #
    # The one environment that was broken was the only environment nothing
    # exercised, because CI never built or ran the Docker image with the
    # configuration release.yml uses. That is the defect this job closes: the
    # image is built here with NO build args, exactly as release.yml builds it,
    # started, and then asserted against over HTTP.
    #
    # `smoke` above proves the containers START. This proves what they RETURN.
    # They are different failure classes: the P0 image started perfectly.
    #
    # The API is deliberately NOT rebuilt here. `smoke` already builds it, runs
    # it against a real PostGIS, and now asserts /api/health reports
    # status:"ok" rather than merely 200 — which is the build/start/answer gate
    # for the API artifact. Standing up a second Postgres in a second job to
    # repeat that would double the cost of the slowest gate in CI for no new
    # information. The API has no build-time-inlined configuration, so the
    # class of defect this job hunts does not apply to it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Build the web image with NO build args, exactly as release.yml does
        # No `--build-arg` of any kind, deliberately. Passing one here would
        # test a configuration no release ever ships and would have hidden the
        # original bug all over again.
        run: docker build -f apps/web/Dockerfile -t ridgeline-web:artifact .

      - name: Serve the image and assert the bytes it returns
        run: |
          # --add-host api:127.0.0.1 is required, and it is worth knowing why:
          # the nginx.conf baked into the image proxy_passes to the literal host
          # `api`, and nginx resolves a literal upstream once at startup and
          # EXITS if the name does not resolve. So the web image cannot start
          # alone — it is only ever startable next to a container named `api`.
          # This stub satisfies the resolve; nothing here talks to the API.
          docker run -d --name web-artifact --add-host api:127.0.0.1 \
            -p 8080:8080 ridgeline-web:artifact

          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/index.html >/dev/null 2>&1 && break
            sleep 1
          done

          ./deploy/verify-served-artifact.sh http://localhost:8080

      - name: Assert the Kubernetes-served artifact carries the same policy
        run: |
          # The chart REPLACES the image's nginx.conf wholesale with a
          # ConfigMap, so every cache rule in apps/web/nginx.conf has to be
          # restated there or it is silently absent on Kubernetes. That is not
          # hypothetical: the ConfigMap shipped without the index.html
          # `no-cache` rule that the image gained in bc95b24, so the "a
          # published release is invisible" P0 was fixed for compose and left
          # live for every cluster install — which is the deployment path
          # actually in use. Verifying only the image would have kept missing
          # it, so the chart's own config is run against the same image and put
          # through the same assertions.
          #
          # dnsResolver is overridden to a literal address because the chart's
          # default is a cluster DNS *name*, which nginx cannot resolve outside
          # a cluster. It is the only difference from what a cluster runs.
          helm template rl ./deploy/helm/ridgeline \
            -s templates/web-configmap.yaml \
            --set web.dnsResolver=127.0.0.11 > /tmp/web-configmap.yaml

          awk '/^  default\.conf: \|/{f=1;next}
               f{ if ($0 !~ /^    / && $0 !~ /^$/) exit; sub(/^    /,""); print }' \
            /tmp/web-configmap.yaml > /tmp/nginx-chart.conf

          # Guard the extraction itself. If the ConfigMap's shape changes, an
          # empty file would mount cleanly, nginx would fall back to its own
          # default server, and this whole step would pass while testing
          # nothing at all.
          grep -q 'listen 8080' /tmp/nginx-chart.conf || {
            echo "::error::could not extract default.conf from the rendered ConfigMap — this check was about to pass vacuously"
            cat /tmp/web-configmap.yaml
            exit 1
          }

          docker run -d --name web-k8s -p 8081:8080 \
            -v /tmp/nginx-chart.conf:/etc/nginx/conf.d/default.conf:ro \
            ridgeline-web:artifact

          for i in $(seq 1 30); do
            curl -fsS http://localhost:8081/index.html >/dev/null 2>&1 && break
            sleep 1
          done

          ./deploy/verify-served-artifact.sh http://localhost:8081

      - name: Container state and logs on failure
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          for c in web-artifact web-k8s; do
            echo "--- $c ---"
            docker logs "$c" 2>&1 | tail -40 || true
          done

  renders-terrain:
    # Does a terrain layer ACTUALLY PAINT, for a real user, over the real
    # internet, from the artifact we ship? Nothing else in this repository
    # asks that, and the founder's report — "nothing works, it's just a
    # satellite map with nothing" — arrived while every other gate was green.
    #
    # The four blind spots this closes, all pointing the same way:
    #   1. No CI job ran a browser AT ALL. `ui-invariants` — mandatory per
    #      CLAUDE.md — has never run here.
    #   2. Every local browser run attaches the DEM relay (`e2e/fixtures.ts`),
    #      so tiles come from localhost and the real URL is never requested.
    #      The only path a user is on was the only path never tested.
    #   3. Unit tests import source, so they cannot see `import.meta.env`
    #      inlined at build time — where the blank-layer P0 lived.
    #   4. `shipped-artifact` greps served bytes. That caught (3) and is worth
    #      keeping, but a grep cannot prove a pixel changed.
    #
    # `real-artifact.spec.ts` imports from `@playwright/test` directly rather
    # than `./fixtures`, so NO relay is attached. That import is the gate. It
    # also fails on zero tile requests rather than passing vacuously, because
    # "asked for nothing, nothing failed" is how a rendering suite measures an
    # empty map for weeks and reports success.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @hunt-maps/web exec playwright install --with-deps chromium

      - name: Assert terrain renders from the real tile source
        working-directory: apps/web
        env:
          # Opt in to real egress. Without it the spec SKIPS loudly rather than
          # passing quietly — a skip is honest, a vacuous pass is not.
          RIDGELINE_REAL_NETWORK: '1'
        run: pnpm exec playwright test real-artifact --reporter=line

      - name: Upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renders-terrain-failure
          path: apps/web/test-results/
          retention-days: 7

  chart:
    # The chart is a release artefact, so it gets the same gate as the code.
    # Rendering only the default values is not enough: most chart bugs live in
    # a conditional branch that defaults never reach, and they surface at
    # `helm install` on someone else's cluster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint ./deploy/helm/ridgeline

      - name: Render every conditional path
        run: |
          helm template rl ./deploy/helm/ridgeline >/dev/null
          helm template rl ./deploy/helm/ridgeline \
            --set ingress.enabled=true --set networkPolicy.enabled=true \
            --set api.pdb.enabled=true --set web.pdb.enabled=true \
            --set api.autoscaling.enabled=true --set redis.enabled=true >/dev/null
          helm template rl ./deploy/helm/ridgeline \
            --set externalDatabase.url=postgresql://u:p@h:5432/d >/dev/null
          helm template rl ./deploy/helm/ridgeline \
            --set postgis.persistence.enabled=false >/dev/null

      - name: Values schema rejects invalid input
        # A schema nobody exercises rots into decoration. These three must
        # fail; if any starts passing, the schema has stopped constraining
        # the thing it claims to.
        run: |
          fails() {
            if helm template rl ./deploy/helm/ridgeline "$@" >/dev/null 2>&1; then
              echo "::error::expected these values to be rejected: $*"
              exit 1
            fi
          }
          fails --set api.logLevel=verbose
          fails --set externalDatabase.url=mysql://nope
          fails --set api.service.port=99999
          fails --set auth.jwtSecret=too-short
          echo "values.schema.json rejects invalid input ✓"

      - name: Package
        run: helm package ./deploy/helm/ridgeline --destination /tmp/chart
