name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # A real PostGIS instance. Spatial behaviour cannot be mocked meaningfully,
      # and a schema that migrates against plain Postgres tells us nothing.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ridgeline
          POSTGRES_PASSWORD: ridgeline
          POSTGRES_DB: ridgeline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ridgeline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ridgeline:ridgeline@localhost:5432/ridgeline_test
      # Test-only value; production refuses to boot without a real secret.
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm --filter @hunt-maps/api exec prisma generate

      - name: Build (topological — terrain → shared → apps)
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Verify migrations apply to an empty database
        run: pnpm --filter @hunt-maps/api exec prisma migrate deploy

      - name: Assert the terrain engine has no runtime dependencies
        # It ships into a browser service worker. A single dependency creeping in
        # breaks the offline path, and it breaks it silently — the bundle just
        # gets bigger until something fails to resolve at runtime.
        run: |
          deps=$(node -p "JSON.stringify(require('./packages/terrain/package.json').dependencies || {})")
          if [ "$deps" != "{}" ]; then
            echo "packages/terrain must have zero runtime dependencies, found: $deps"
            exit 1
          fi
          echo "packages/terrain is dependency-free ✓"

      - name: Assert design tokens have not drifted from generated CSS
        # tokens.css is generated from tokens.ts. Both are consumed — CSS by the
        # stylesheets, TypeScript by MapLibre paint properties and canvas ramps —
        # so a stale stylesheet means the chrome and the map disagree about what
        # "accent" is, invisibly.
        run: |
          pnpm --filter @hunt-maps/design build:tokens
          if ! git diff --quiet -- packages/design/src/tokens.css; then
            echo "tokens.css is out of date. Run: pnpm --filter @hunt-maps/design build:tokens"
            git --no-pager diff -- packages/design/src/tokens.css
            exit 1
          fi
          echo "design tokens are in sync ✓"

      - name: Assert no literal colours leaked outside the design system
        # The design system is only a source of truth if nothing bypasses it.
        # A hex literal in an app stylesheet is how a design system quietly
        # stops being one — the value works, so nobody notices until a palette
        # change misses half the UI.
        run: |
          leaked=$(grep -rInE '#[0-9a-fA-F]{3,8}\b' \
            --include='*.css' --include='*.tsx' --include='*.ts' \
            apps/web/src \
            | grep -v 'packages/design' \
            | grep -vE '^\s*//|/\*|\*' \
            || true)
          if [ -n "$leaked" ]; then
            echo "Literal colours found outside packages/design:"
            echo "$leaked"
            echo ""
            echo "Add the value to packages/design/src/tokens.ts and reference the token."
            exit 1
          fi
          echo "no colour literals outside the design system ✓"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: JWT_SECRET=ci-placeholder docker compose config --quiet

      # A Dockerfile that installs before copying every workspace dependency's
      # package.json cannot build at all — pnpm fails resolving `workspace:*`.
      # `@hunt-maps/design` was missing from apps/web/Dockerfile from the day
      # the design system was extracted, so the web image silently stopped
      # building. This is cheaper to assert than to rediscover: it fails in
      # under a second, where the real symptom was an 8-second build failure
      # inside a job that only ran on push.
      - name: Assert Dockerfiles copy every workspace dependency they need
        run: |
          node -e '
            const fs = require("fs");
            let bad = false;
            for (const app of fs.readdirSync("apps")) {
              const pkgPath = `apps/${app}/package.json`;
              const dockerfile = `apps/${app}/Dockerfile`;
              if (!fs.existsSync(pkgPath) || !fs.existsSync(dockerfile)) continue;
              const deps = Object.keys(JSON.parse(fs.readFileSync(pkgPath, "utf8")).dependencies || {})
                .filter((d) => d.startsWith("@hunt-maps/"));
              const df = fs.readFileSync(dockerfile, "utf8");
              for (const dep of deps) {
                const name = dep.split("/")[1];
                if (!df.includes(`packages/${name}/package.json`)) {
                  console.error(`${dockerfile} never copies packages/${name}/package.json, but ${pkgPath} depends on ${dep} — pnpm install will fail resolving workspace:*`);
                  bad = true;
                }
              }
            }
            process.exit(bad ? 1 : 0);
          '
      # The images are built and actually run in the `smoke` job below, so
      # they are not built twice here.

  smoke:
    # Builds both images and actually RUNS them. `docker build` succeeding
    # proves only that the image assembles — it says nothing about whether the
    # process inside can start, which is exactly what changed when both images
    # moved to non-root users. Every other gate in this repo would stay green
    # while the containers crash-looped on a permissions error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -f apps/api/Dockerfile -t ridgeline-api:ci .
          docker build -f apps/web/Dockerfile -t ridgeline-web:ci .

      - name: Assert both images run as non-root
        run: |
          for img in ridgeline-api:ci ridgeline-web:ci; do
            uid=$(docker run --rm --entrypoint sh "$img" -c 'id -u')
            echo "$img runs as uid $uid"
            if [ "$uid" = "0" ]; then
              echo "::error::$img runs as root"
              exit 1
            fi
          done

      - name: Run the stack and hit the endpoints
        run: |
          docker network create ridgeline-ci
          docker run -d --name db --network ridgeline-ci \
            -e POSTGRES_USER=ridgeline -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_DB=ridgeline postgis/postgis:16-3.4
          # Wait for the database rather than sleeping a fixed amount; a fixed
          # sleep is how this kind of job becomes intermittently red.
          for i in $(seq 1 60); do
            docker exec db pg_isready -U ridgeline >/dev/null 2>&1 && break
            sleep 2
          done

          docker run -d --name api --network ridgeline-ci -p 3001:3001 \
            -e DATABASE_URL=postgresql://ridgeline:ci@db:5432/ridgeline \
            -e JWT_SECRET=ci-smoke-test-secret-at-least-32-characters-long \
            -e NODE_ENV=production -e PORT=3001 \
            ridgeline-api:ci
          docker run -d --name web --network ridgeline-ci -p 8080:8080 ridgeline-web:ci

          # The API migrates on boot, so allow for that before calling it dead.
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::API never became healthy"
            docker logs api
            exit 1
          fi
          curl -fsS http://localhost:3001/api/health | tee /dev/stderr

          curl -fsS http://localhost:8080/index.html >/dev/null \
            || { echo "::error::web did not serve index.html"; docker logs web; exit 1; }

          echo "api and web both healthy as non-root"

      - name: Container state and logs on failure
        if: failure()
        run: |
          # Status first. A container that exited tells you immediately that
          # this is a startup failure rather than a health-check timeout, and
          # the two have completely different causes.
          echo '--- container state ---'
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          for c in db api web; do
            code=$(docker inspect -f '{{.State.ExitCode}}' "$c" 2>/dev/null || echo '?')
            echo "--- $c (exit=$code) ---"
            docker logs "$c" 2>&1 | tail -60 || true
          done

  chart:
    # The chart is a release artefact, so it gets the same gate as the code.
    # Rendering only the default values is not enough: most chart bugs live in
    # a conditional branch that defaults never reach, and they surface at
    # `helm install` on someone else's cluster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint ./deploy/helm/ridgeline

      - name: Render every conditional path
        run: |
          helm template rl ./deploy/helm/ridgeline >/dev/null
          helm template rl ./deploy/helm/ridgeline \
            --set ingress.enabled=true --set networkPolicy.enabled=true \
            --set api.pdb.enabled=true --set web.pdb.enabled=true \
            --set api.autoscaling.enabled=true --set redis.enabled=true >/dev/null
          helm template rl ./deploy/helm/ridgeline \
            --set externalDatabase.url=postgresql://u:p@h:5432/d >/dev/null
          helm template rl ./deploy/helm/ridgeline \
            --set postgis.persistence.enabled=false >/dev/null

      - name: Values schema rejects invalid input
        # A schema nobody exercises rots into decoration. These three must
        # fail; if any starts passing, the schema has stopped constraining
        # the thing it claims to.
        run: |
          fails() {
            if helm template rl ./deploy/helm/ridgeline "$@" >/dev/null 2>&1; then
              echo "::error::expected these values to be rejected: $*"
              exit 1
            fi
          }
          fails --set api.logLevel=verbose
          fails --set externalDatabase.url=mysql://nope
          fails --set api.service.port=99999
          fails --set auth.jwtSecret=too-short
          echo "values.schema.json rejects invalid input ✓"

      - name: Package
        run: helm package ./deploy/helm/ridgeline --destination /tmp/chart
