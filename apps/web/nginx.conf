server {
  # 8080, not 80: the image is nginx-unprivileged and runs as uid 101, which
  # cannot bind a privileged port. Nothing below 1024 is available to it.
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The service worker must never be cached, or users get stuck on a stale
  # shell and their "offline app" is last week's build.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed assets are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
