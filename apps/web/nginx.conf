server {
  # 8080, not 80: the image is nginx-unprivileged and runs as uid 101, which
  # cannot bind a privileged port. Nothing below 1024 is available to it.
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must revalidate on every request, and this is not optional.
  #
  # It is the only unhashed file that names the hashed bundles, so it is the
  # single point where a deploy becomes visible. Without an explicit
  # Cache-Control, nginx sends only Last-Modified/ETag, and browsers fall back
  # to *heuristic* freshness — typically 10% of the file's age — serving it
  # from cache with no request at all. The stale copy then references the
  # previous /assets/ hashes, which are cached `immutable` for a year below.
  #
  # Net effect: a correctly built, correctly published release is invisible to
  # anyone who had already loaded the site, and stays invisible. That is
  # exactly the "deployed the new version and the UI did not change" report
  # this rule exists to prevent. `no-cache` still allows a 304, so this costs
  # one conditional request per load, not a re-download.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    expires 0;
  }

  # The service worker must never be cached, or users get stuck on a stale
  # shell and their "offline app" is last week's build.
  #
  # registerSW.js and the manifest belong here for the same reason: both are
  # unhashed, both are fetched by URL, and a cached registerSW.js can keep
  # pointing a client at a service worker generation that no longer exists.
  location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed assets are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
