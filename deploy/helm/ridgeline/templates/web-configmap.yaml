apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ridgeline.web.fullname" . }}
  labels:
    {{- include "ridgeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  # This replaces the nginx.conf baked into the image.
  #
  # The image's copy hardcodes `proxy_pass http://api:3001/api/`, which is
  # correct for docker-compose (where the service is literally called `api`)
  # and wrong here, where the Service is named after the release. Rendering it
  # as a ConfigMap keeps the release name free instead of forcing every
  # install to be named so that the baked hostname happens to resolve.
  default.conf: |
    # Resolve the upstream at request time, not at startup.
    #
    # nginx resolves a literal hostname in proxy_pass once, when it loads its
    # config, and exits if the name does not resolve. Helm gives no ordering
    # guarantee between the web Deployment and the api Service, so on a cold
    # install nginx can lose that race and CrashLoopBackOff on a cluster where
    # nothing is actually wrong. Assigning the upstream to a variable defers
    # resolution to each request and makes the pod tolerant of the API being
    # slow, restarting, or briefly absent.
    resolver {{ .Values.web.dnsResolver }} valid=10s ipv6=off;

    server {
      # 8080, not 80 — the image runs unprivileged as uid 101 and cannot bind
      # a port below 1024.
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      # index.html must revalidate on every request, and this is not optional.
      #
      # This block replaces the nginx.conf baked into the image, so every rule
      # the image had must be repeated here or it is silently LOST on
      # Kubernetes. That is not hypothetical: this ConfigMap shipped without
      # the index.html rule that apps/web/nginx.conf gained in bc95b24, so the
      # "a published release is invisible" P0 was fixed for compose and left
      # live for every cluster install — the deployment path actually in use.
      #
      # index.html is the only unhashed file that names the hashed bundles, so
      # it is the single point where a deploy becomes visible. With no explicit
      # Cache-Control, nginx sends only Last-Modified/ETag and browsers fall
      # back to heuristic freshness — typically 10% of the file's age — serving
      # the old shell with no request at all. That shell references the previous
      # /assets/ hashes, which are cached immutable for a year below. Net
      # effect: a correct build, correctly published and correctly rolled out,
      # that nobody can see. `no-cache` still allows a 304, so this costs one
      # conditional request per load, not a re-download.
      #
      # deploy/verify-served-artifact.sh asserts this against a running
      # deployment, and CI asserts it against this rendered config.
      location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
      }

      # The service worker must never be cached, or users get stuck on a stale
      # shell and their "offline app" is last week's build.
      #
      # registerSW.js and the manifest belong here for the same reason: both are
      # unhashed, both are fetched by URL, and a cached registerSW.js can keep
      # pointing a client at a service worker generation that no longer exists.
      location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
      }

      location /api/ {
        set $ridgeline_api "{{ include "ridgeline.api.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.service.port }}";
        # $request_uri, not a rewritten path. Once proxy_pass contains a
        # variable, nginx stops substituting the location prefix for you, so
        # the usual `proxy_pass http://upstream/api/` trick silently changes
        # meaning. $request_uri passes the original path and query through
        # unchanged, which is what the baked config resolved to anyway:
        # location /api/ + proxy_pass .../api/ is the identity mapping.
        proxy_pass http://$ridgeline_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # DEM tile requests can be slow on a cold cache.
        proxy_read_timeout 60s;
      }

      location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # nginx's stock mime.types has no entry for .webmanifest, so the PWA manifest
      # is served as application/octet-stream. Chrome still installs from it, which
      # is why this went unnoticed, but the spec type is application/manifest+json
      # and some user agents and link-preview crawlers do check. Declared here
      # rather than by editing the image's mime.types, so the compose and
      # Kubernetes paths pick it up from the same place as every other rule.
      types {
        application/manifest+json  webmanifest;
      }

      gzip on;
      gzip_types text/css application/javascript application/json
                  application/manifest+json image/svg+xml;
    }
