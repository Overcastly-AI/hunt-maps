{{- /*
Availability and blast-radius controls. All opt-in, because on a single-node
laptop cluster a PodDisruptionBudget with one replica blocks node drains and
an HPA fights a fixed replicaCount — both of which look like the chart is
broken rather than doing what it was told.
*/ -}}
{{- if .Values.api.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ridgeline.api.fullname" . }}
  labels:
    {{- include "ridgeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if .Values.api.pdb.minAvailable }}
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.api.pdb.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ridgeline.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
{{- end }}
{{- if .Values.web.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ridgeline.web.fullname" . }}
  labels:
    {{- include "ridgeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if .Values.web.pdb.minAvailable }}
  minAvailable: {{ .Values.web.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.web.pdb.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ridgeline.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
{{- end }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ridgeline.api.fullname" . }}
  labels:
    {{- include "ridgeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ridgeline.api.fullname" . }}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      # Terrain analysis arrives in bursts — a user sweeping the wind fires a
      # run of requests in seconds. Scale up promptly.
      stabilizationWindowSeconds: 30
    scaleDown:
      # But scale down slowly. A corridor solve is expensive to restart, and
      # flapping replicas throw away warm caches for no benefit.
      stabilizationWindowSeconds: 300
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
{{- /*
Default-deny ingress for the database, with an explicit allowance for the API.

This is the control that matters most in this chart: everything else guards
the edge, and this one contains the blast radius if something inside the
cluster is compromised. Note it only takes effect if the CNI enforces
NetworkPolicy — kind's default (kindnet) does NOT, so a policy that renders
correctly can still enforce nothing. Verify with a real deny test before
relying on it.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ridgeline.postgis.fullname" . }}
  labels:
    {{- include "ridgeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ridgeline.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgis
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ridgeline.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ridgeline.api.fullname" . }}
  labels:
    {{- include "ridgeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ridgeline.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes: ['Ingress']
  ingress:
    # Only the web tier and the helm-test pod may reach the API directly.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ridgeline.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: web
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ridgeline.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
{{- end }}
