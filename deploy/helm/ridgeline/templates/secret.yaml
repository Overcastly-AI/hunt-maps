{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ridgeline.fullname" . }}
  labels:
    {{- include "ridgeline.labels" . | nindent 4 }}
  annotations:
    # Never garbage-collect this on uninstall. The Postgres password is set
    # once when the data volume is initialised and is not re-read afterwards;
    # if the Secret is deleted while a retained PVC survives, the next install
    # generates a new password and the API cannot authenticate against its own
    # existing data. That failure surfaces as a plain auth error and sends you
    # looking at credentials rather than at lifecycle.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwt-secret: {{ include "ridgeline.resolveSecret" (dict "ctx" . "key" "jwt-secret" "value" .Values.auth.jwtSecret "length" 48) | quote }}
  {{- if not .Values.externalDatabase.url }}
  postgres-password: {{ include "ridgeline.resolveSecret" (dict "ctx" . "key" "postgres-password" "value" .Values.postgis.auth.password "length" 24) | quote }}
  {{- end }}
  database-url: {{ include "ridgeline.databaseUrl" . | quote }}
{{- end }}
