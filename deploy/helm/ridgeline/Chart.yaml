apiVersion: v2
name: ridgeline
description: >-
  Ridgeline — self-hosted hunting map and terrain-analytics platform.
  PostGIS + NestJS API + MapLibre PWA, packaged for a local cluster.
type: application

# Chart version moves when the packaging changes; appVersion tracks the app.
version: 1.2.1
appVersion: "1.2.1"

keywords:
  - hunting
  - gis
  - postgis
  - terrain
home: https://github.com/Overcastly-AI/hunt-maps
sources:
  - https://github.com/Overcastly-AI/hunt-maps

maintainers:
  - name: Ridgeline

# GHCR links a package to its repository through this annotation, exactly as
# the images do through their OCI label. Without it the published chart is an
# anonymous artifact: no source repo, no README, no provenance on its package
# page.
annotations:
  org.opencontainers.image.source: https://github.com/Overcastly-AI/hunt-maps
  org.opencontainers.image.licenses: MIT
