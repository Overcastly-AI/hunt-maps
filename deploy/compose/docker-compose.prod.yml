# Ridgeline — production compose, for a single Docker host (Hostinger VPS etc.)
#
# This file PULLS published images. If GitHub Actions has not published them —
# see deploy/compose/README.md, a private repo on a personal account runs on
# metered Actions minutes and stops building when they are gone — layer the
# build override on top and build on the VPS instead:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml up -d --build
#
# Differences from the repo-root docker-compose.yml, which is a dev file:
#   - no source bind mounts, no exposed database port
#   - Postgres is not published to the host at all
#   - the API is not published either; only the web container takes traffic,
#     and it proxies /api internally. One port open instead of three.
#   - restart: always, and real healthchecks with dependency ordering

name: ridgeline

services:
  db:
    # PostGIS, not plain Postgres. Every meaningful query here is spatial; a
    # stock postgres image comes up healthy and then fails on the first
    # geometry column.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ridgeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ridgeline}
      # Initialise into a subdirectory of the volume. On ext4 the mount root
      # contains lost+found, which makes the directory look non-empty and
      # aborts initdb with an error that never mentions lost+found.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ridgeline} -d ${POSTGRES_DB:-ridgeline}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    # Deliberately no `ports:`. The database is reachable only on the compose
    # network. Publishing 5432 on a VPS puts Postgres on the public internet,
    # which is the single most common way a small deployment gets owned.

  api:
    image: ghcr.io/overcastly-ai/hunt-maps-api:${RIDGELINE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ridgeline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ridgeline}
      # No default. The app refuses to boot without a real secret rather than
      # shipping a weak one. Note the quoting and the absence of ": " in the
      # hint — a colon-space inside an unquoted YAML scalar ends the scalar,
      # which is what made the dev compose file unparseable for weeks.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env — run 'openssl rand -base64 48'}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEM_3DEP_TEMPLATE: ${DEM_3DEP_TEMPLATE:-}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /api/health reports PostGIS reachability, so this tracks the thing that
      # actually matters — whether spatial queries can run. A TCP check would
      # call a container healthy that cannot serve a map.
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3001/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: always
    # Also no `ports:`. Traffic reaches the API through the web container's
    # nginx at /api, which keeps it same-origin and means CORS never has to be
    # loosened for the browser to talk to it.

  web:
    image: ghcr.io/overcastly-ai/hunt-maps-web:${RIDGELINE_TAG:-latest}
    depends_on:
      api:
        condition: service_started
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/index.html >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

volumes:
  db-data:
