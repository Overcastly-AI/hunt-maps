# Ridgeline — production compose, for a single Docker host (Hostinger VPS etc.)
#
# This file PULLS published images. If GitHub Actions has not published them —
# see deploy/compose/README.md, a private repo on a personal account runs on
# metered Actions minutes and stops building when they are gone — layer the
# build override on top and build on the VPS instead:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Differences from the repo-root docker-compose.yml, which is a dev file:
#   - no source bind mounts, no exposed database port
#   - Postgres is not published to the host at all
#   - the API is not published either; only the web container takes traffic,
#     and it proxies /api internally. One port open instead of three.
#   - restart: always, and real healthchecks with dependency ordering
#   - security_opt: no-new-privileges on every service, which blocks setuid
#     binaries inside a container from gaining privileges the container was
#     not started with

name: ridgeline

services:
  db:
    # PostGIS, not plain Postgres. Every meaningful query here is spatial; a
    # stock postgres image comes up healthy and then fails on the first
    # geometry column.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ridgeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ridgeline}
      # Initialise into a subdirectory of the volume. On ext4 the mount root
      # contains lost+found, which makes the directory look non-empty and
      # aborts initdb with an error that never mentions lost+found.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ridgeline} -d ${POSTGRES_DB:-ridgeline}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    security_opt: ['no-new-privileges:true']
    # Deliberately no `ports:`. The database is reachable only on the compose
    # network. Publishing 5432 on a VPS puts Postgres on the public internet,
    # which is the single most common way a small deployment gets owned.

  api:
    image: ghcr.io/overcastly-ai/hunt-maps-api:${RIDGELINE_TAG:-latest}
    labels:
      # Opts this container in to the optional `autoupdate` profile below. The
      # label is inert unless Watchtower is actually running, and `db` is
      # deliberately NOT labelled — an unattended major-version Postgres bump
      # would refuse to start against an existing data directory, and that is
      # not a failure you want discovered from a truck at 05:30.
      com.centurylinklabs.watchtower.enable: 'true'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ridgeline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ridgeline}
      # No default. The app refuses to boot without a real secret rather than
      # shipping a weak one. Note the quoting and the absence of ": " in the
      # hint — a colon-space inside an unquoted YAML scalar ends the scalar,
      # which is what made the dev compose file unparseable for weeks.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env — run 'openssl rand -base64 48'}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEM_3DEP_TEMPLATE: ${DEM_3DEP_TEMPLATE:-}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /api/health reports PostGIS reachability, so this tracks the thing that
      # actually matters — whether spatial queries can run. A TCP check would
      # call a container healthy that cannot serve a map.
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3001/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: always
    security_opt: ['no-new-privileges:true']
    # Also no `ports:`. Traffic reaches the API through the web container's
    # nginx at /api, which keeps it same-origin and means CORS never has to be
    # loosened for the browser to talk to it.

  web:
    image: ghcr.io/overcastly-ai/hunt-maps-web:${RIDGELINE_TAG:-latest}
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    depends_on:
      api:
        condition: service_started
    ports:
      - '${WEB_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/index.html >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    security_opt: ['no-new-privileges:true']

  # ---------------------------------------------------------------------------
  # Optional: unattended updates. OFF unless you ask for it.
  # ---------------------------------------------------------------------------
  #
  #   docker compose --profile autoupdate up -d
  #
  # Polls GHCR for a newer image behind the tag you are running, pulls it, and
  # recreates the api and web containers with the same configuration. No
  # inbound access, no SSH keys in GitHub, no secrets anywhere: the host makes
  # an outbound HTTPS request on a schedule and that is the entire mechanism.
  #
  # The honest tradeoff, because this is a hunting app:
  #
  #   - An update RESTARTS the containers. A hunter mid-hunt loses the map for
  #     the seconds that takes, and any request in flight fails. The PWA keeps
  #     working from its cache and queued writes are idempotent, so this is
  #     survivable — but "survivable" is not "free", and it happens without
  #     anyone deciding it should happen right now.
  #   - Watchtower needs the Docker socket, which is root-equivalent on the
  #     host. Anything that compromises this container owns the machine. It is
  #     mounted read-only, which raises the bar but does not remove it: the
  #     socket API is still fully usable read-only-mounted.
  #   - It follows a MOVING tag. With RIDGELINE_TAG pinned to a version — which
  #     is what the README recommends — there is nothing to move to and this
  #     service does nothing at all, forever, silently. Auto-update and pinning
  #     are mutually exclusive; pick one on purpose.
  #   - A bad release lands on the host with nobody watching. There is no
  #     canary and no automatic rollback. Recovery is manual: set RIDGELINE_TAG
  #     to the previous version and `docker compose up -d`.
  #
  # If any of that is unacceptable, use ./upgrade.sh instead — same result, at
  # a moment you chose, with the artifact verified before you walk away.
  watchtower:
    profiles: ['autoupdate']
    # Pinned, not `latest`: the thing that updates everything else must not
    # update itself unattended. 1.7.1 is the last release of containrrr's
    # Watchtower, which is lightly maintained — a reason to keep this optional
    # rather than a reason to avoid it, but know it before you enable it.
    image: containrrr/watchtower:1.7.1
    # --label-enable: touch only the two containers labelled above, never the
    # database. --cleanup: delete the superseded image, or a VPS disk fills up
    # with old builds and the first symptom is Postgres unable to write.
    command: --label-enable --cleanup
    environment:
      # Where the mounted registry credentials live. Watchtower reads
      # $DOCKER_CONFIG/config.json exactly as the docker CLI does.
      DOCKER_CONFIG: /config
      # A six-field cron (with seconds), in the container's timezone. Default
      # is 13:00 — the middle of the day, deliberately: between the morning
      # sit and the evening sit is the only window where a restart costs
      # nobody anything. Never leave this at a default that can fire at first
      # light.
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 0 13 * * *}
      # Set this or the schedule runs in UTC and "13:00" is not your midday.
      TZ: ${TZ:-UTC}
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}
    volumes:
      # Read-only: Watchtower only needs to inspect, pull, and recreate, and a
      # read-only mount blocks nothing it needs while removing the easiest
      # write paths. It does not make socket access safe — see above.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Registry credentials, if the GHCR packages are private. Without this a
      # private package fails to pull and Watchtower logs it and carries on —
      # which looks exactly like "there was no new version".
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/config:ro
    restart: always
    security_opt: ['no-new-privileges:true']

volumes:
  db-data:
