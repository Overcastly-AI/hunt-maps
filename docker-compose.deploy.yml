# Ridgeline — one-file deploy, importable directly from a URL.
#
#   https://raw.githubusercontent.com/Overcastly-AI/hunt-maps/main/docker-compose.deploy.yml
#
# Deliberately self-contained for platforms that import a compose file by URL
# and give it neither a repository checkout nor an environment file:
#   - no `build:` sections, so it never needs the source
#   - no ${VAR} interpolation, so it never needs a .env
#   - every value literal
#
# ---------------------------------------------------------------------------
# THE CREDENTIALS BELOW ARE PUBLIC. This repository is public, so anything in
# this file is readable by anyone. That is acceptable only because this is a
# disposable demo stack: Postgres is not published to the host, so the database
# password is reachable only from inside the compose network. The JWT secret,
# however, would let anyone mint valid tokens against an instance running this
# file. Never reuse these values, and never run this file for anything you care
# about — generate fresh secrets and keep them out of git.
# ---------------------------------------------------------------------------

name: ridgeline

services:
  db:
    # PostGIS, not plain Postgres. Every meaningful query here is spatial; a
    # stock postgres image comes up healthy and then fails on the first
    # geometry column.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ridgeline
      POSTGRES_PASSWORD: "sVK9hY5Sk9chx1PVQhIKOSLcOlHJH6W6"
      POSTGRES_DB: ridgeline
      # Initialise into a subdirectory of the mount. On ext4 the mount root
      # holds lost+found, which makes the directory look non-empty and aborts
      # initdb with an error that never mentions lost+found.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ridgeline -d ridgeline']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    # No `ports:` on purpose. Publishing 5432 would put Postgres on the public
    # internet, which is the most common way a small deployment is compromised.

  api:
    image: ghcr.io/overcastly-ai/hunt-maps-api:latest
    environment:
      # The password is alphanumeric by construction. A base64 password would
      # contain / and +, which are structural in a URI, and the resulting
      # connection failure looks exactly like wrong credentials.
      DATABASE_URL: "postgresql://ridgeline:sVK9hY5Sk9chx1PVQhIKOSLcOlHJH6W6@db:5432/ridgeline"
      JWT_SECRET: "XiGxxnReAJFs7pGrIyJ0rsYPAo/mJ/u+t9591WTLyutPlx7F2RR7dnpd5lF7LUX9"
      # Must match the address you actually load the app from — scheme, host
      # and port — or the browser blocks every API call.
      CORS_ORIGINS: "http://167.88.46.225:8080"
      DEM_3DEP_TEMPLATE: ""
      NODE_ENV: production
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /api/health reports PostGIS reachability, so this is green only when
      # spatial queries can actually run. A TCP check would call a container
      # healthy that cannot serve a map.
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3001/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: always
    # Unpublished as well. The browser reaches the API through the web
    # container's nginx at /api, same-origin, so CORS never has to be widened.

  web:
    image: ghcr.io/overcastly-ai/hunt-maps-web:latest
    depends_on:
      api:
        condition: service_started
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/index.html >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

volumes:
  db-data:
